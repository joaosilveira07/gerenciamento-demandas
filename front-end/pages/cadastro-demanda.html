<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Demanda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/cadastro-demanda.css">
    <script src="../js/cadastro-demanda.js" defer></script>
</head>
<body>
    <main class="main">
        <div class="titulo">
            <h1>Cadastrar nova demanda:</h1>
        </div>

        <div class="card-form">
            <form id="form-cadastro" class="form" novalidate>
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome">

                <label for="descricao">Descrição:</label>
                <input type="text" name="descricao" id="descricao">

                <label for="tipo">Tipo:</label>
                <select name="tipo" id="tipo">
                    <option value="tarefa">Tarefa</option>
                    <option value="defeito">Defeito</option>
                    <option value="melhoria">Melhoria</option>
                </select>

                <label for="prioridade">Prioridade</label>
                <select name="prioridade" id="prioridade">
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                    <option value="critica">Crítica</option>
                </select>

                <label for="projeto">Projeto:</label>
                <input type="text" name="projeto" id="projeto">

                <label for="responsavel">Responsável:</label>
                <input type="text" name="responsavel" id="responsavel">

                <label for="prazo">Prazo:</label>
                <input type="date" name="prazo" id="prazo">
            </form>
        </div>
    </main>
</body>
</html>
